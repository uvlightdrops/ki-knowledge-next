$schema: "http://json-schema.org/draft-07/schema#"
type: object
additionalProperties: false
required: [apps, stack]
properties:
  apps:
    type: object
    additionalProperties: false
    required: [ki_knowledge_next]
    properties:
      ki_knowledge_next:
        type: object
        additionalProperties: false
        required: [paths, django, relation_catalog]
        properties:
          relation_catalog:
            type: object
            additionalProperties: false
            required: [preset, types]
            properties:
              preset:
                type: string
                enum: [basic, documentation, knowledge]
                default: documentation
              types:
                type: array
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required: [key, label, description]
                  properties:
                    key:
                      type: string
                      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                      maxLength: 80
                    label:
                      type: string
                      minLength: 1
                      maxLength: 150
                    description:
                      type: string
                      minLength: 1
                    color:
                      type: string
                    enabled:
                      type: boolean
          paths:
            type: object
            additionalProperties: false
            required: [var, workspace, documentation, document_relations, data, data_relations]
            properties:
              var:
                type: string
                minLength: 1
                default: var
              workspace:
                type: string
                minLength: 1
                default: "~/dev_wiki"
              documentation:
                type: string
                minLength: 1
                default: doc
              document_relations:
                type: string
                default: ""
                description: "Empty uses doc-relations below paths.var."
              data:
                type: string
                minLength: 1
                default: "~/dev_data/ki-knowledge"
              data_relations:
                type: string
                minLength: 1
                default: "~/dev_wiki_rel_ki"
          django:
            type: object
            additionalProperties: false
            required: [debug, allowed_hosts, secret_key, static_root]
            properties:
              debug:
                type: boolean
                default: true
              allowed_hosts:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
                default: [localhost, "127.0.0.1"]
              secret_key:
                type: string
                default: ""
                writeOnly: true
                x-secret: true
              static_root:
                type: string
                default: ""
                description: "Empty uses static below paths.var."
  stack:
    type: object
    additionalProperties: false
    required: [name, target, services]
    properties:
      name:
        type: string
        const: ki-knowledge-next
      target:
        type: string
        enum: [local]
      services:
        type: object
        additionalProperties: false
        required: [django]
        properties:
          django:
            type: object
            additionalProperties: false
            required: [host, port, command, health_path]
            properties:
              host:
                type: string
                minLength: 1
              port:
                type: integer
                minimum: 1
                maximum: 65535
              command:
                type: array
                minItems: 1
                items:
                  type: string
              health_path:
                type: string
                const: /health/ready/
              health_timeout:
                type: integer
                minimum: 1
              health_retries:
                type: integer
                minimum: 1
              marker:
                type: string
              env:
                type: object
                additionalProperties:
                  type: string
