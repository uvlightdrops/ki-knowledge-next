stack:
  name: ki-knowledge-next
  target: local
  services:
    django:
      host: "127.0.0.1"
      port: 8780
      command: ["{python}", "{root}/manage.py", runserver, --noreload, "{host}:{port}"]
      health_path: /health/ready/
      health_timeout: 30
      health_retries: 60
      marker: manage.py runserver
    import-worker:
      port: 0
      command: ["{python}", "-u", "{root}/manage.py", content_worker]
      marker: manage.py content_worker
