stack:
  name: ki-knowledge-next
  target: local
  services:
    django:
      host: "127.0.0.1"
      port: 8780
      command: ["{python}", -m, knext.devserver, --noreload, "{host}:{port}"]
      health_path: /health/ready/
      health_timeout: 30
      health_retries: 60
      marker: knext.devserver
