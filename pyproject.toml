[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-knowledge-next"
version = "0.1.0"
description = "Frisch aufgesetztes Django-Projekt für die Weiterentwicklung von ki-knowledge"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0",
    "wissenswiki-django",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "Markdown>=3.7",
    "bleach>=6.2",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9"]

[tool.setuptools.packages.find]
include = ["knext*"]

[tool.setuptools.package-data]
"knext.content" = ["templates/content/*.html", "static/content/*.css", "static/knext/*"]
"knext" = ["templates/*.html", "templates/admin/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "knext.settings"
testpaths = ["tests"]
